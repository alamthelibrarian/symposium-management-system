name: Apply Preview D1 migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_PREVIEW to confirm the Preview database migration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: symposium-preview-d1-migrations
  cancel-in-progress: false

jobs:
  migrate-preview:
    if: ${{ inputs.confirm == 'APPLY_PREVIEW' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check pending Preview migrations
        run: npx wrangler d1 migrations list symposium-management-preview --env preview --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply Preview migrations
        run: npx wrangler d1 migrations apply symposium-management-preview --env preview --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
