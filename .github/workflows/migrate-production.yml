name: Apply Production D1 migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_PRODUCTION to confirm the Production database migration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: symposium-production-d1-migrations
  cancel-in-progress: false

jobs:
  migrate-production:
    if: ${{ inputs.confirm == 'APPLY_PRODUCTION' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check pending Production migrations
        run: npx wrangler d1 migrations list symposium-management-system --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply Production migrations
        run: npx wrangler d1 migrations apply symposium-management-system --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
